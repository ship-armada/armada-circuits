# ABOUTME: Read-only contribution check for ceremony PRs (head branch ceremony/turn-*), run from the base branch.
# ABOUTME: PR content is only data: base checkout, read-only token, no secrets, and the job never writes anything.
name: contribution-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: contribution-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution-check:
    if: startsWith(github.event.pull_request.head.ref, 'ceremony/turn-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CIRCOM_VERSION: v2.2.3
      CIRCOM_SHA256: 85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3
      # Hermez perpetual Powers of Tau, power 17 (pinned hash; see docs/SECURITY_REVIEW.md)
      PTAU_URL: https://circom.info/powersOfTau28_hez_final_17.ptau
      PTAU_SHA256: 6b662a324867139fb1a20a324d90b6ff61856dfb23f59326909f14b0e2483ae0
    steps:
      # pull_request_target checks out the base branch: the PR's code and workflows are never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install circom
        run: |
          curl -fsSL -o /tmp/circom "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64"
          echo "${CIRCOM_SHA256}  /tmp/circom" | sha256sum -c -
          sudo install -m 0755 /tmp/circom /usr/local/bin/circom

      - run: npm ci

      - name: Cache phase-1 ptau
        id: ptau-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ptau/pot17_final.ptau
          key: ptau-${{ env.PTAU_SHA256 }}

      - name: Fetch phase-1 ptau
        if: steps.ptau-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/ptau
          curl -fsSL -o build/ptau/pot17_final.ptau "${PTAU_URL}"

      - name: Check phase-1 ptau hash
        run: echo "${PTAU_SHA256}  build/ptau/pot17_final.ptau" | sha256sum -c -

      # The r1cs the zkeys are verified against comes from the base branch's circuits.
      - run: npm run compile

      - name: Check contribution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node dist/src/ci-check.js
